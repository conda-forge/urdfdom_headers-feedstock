schema_version: 1

context:
  version: "1.1.2"

package:
  name: urdfdom_headers
  version: ${{ version }}

source:
  url: https://github.com/ros/urdfdom_headers/archive/${{ version }}.tar.gz
  sha256: 7602e37c6715fbf4cec3f0ded1e860157796423dc79da062a0e5ccb1226dc8e6
  patches:
    - if: win
      then: msvc_include.patch

build:
  number: 1

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - if: unix
      then: make

tests:
  - package_contents:
      include:
        - urdf_model/model.h
        - urdf_sensor/sensor.h
      files:
        - if: unix
          then: lib/urdfdom_headers/cmake/urdfdom_headers-config.cmake
        - if: win
          then: Library/CMake/urdfdom_headers-config.cmake
  - requirements:
      run:
        - pkg-config
    script:
      - pkg-config --modversion urdfdom_headers
      - pkg-config --exists --print-errors --debug urdfdom_headers
      - pkg-config --validate --print-errors --debug urdfdom_headers

about:
  homepage: https://github.com/ros/urdfdom_headers
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Headers for URDF parsers
  repository: https://github.com/ros/urdfdom_headers

extra:
  recipe-maintainers:
    - jcarpent
    - wolfv
    - traversaro
